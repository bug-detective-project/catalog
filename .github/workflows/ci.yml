name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: dist matches the sources
        run: |
          npm run build
          # Also catches new files under dist/ that were never committed.
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --porcelain -- dist
            echo "dist is out of date: run npm run build and commit dist/"
            exit 1
          fi
