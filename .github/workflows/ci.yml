name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: dist matches the sources
        run: |
          npm run build
          git diff --exit-code -- dist || { echo "dist is out of date: run npm run build and commit dist/"; exit 1; }
