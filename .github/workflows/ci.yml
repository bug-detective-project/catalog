name: ci

# Every action is pinned by commit hash (tools/check-action-pins.mjs; the tests check this
# repository, so check:ci runs nothing twice: typecheck, tests, Prettier).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: npm
      - run: npm ci
      - run: npm run check:ci
      - name: dist matches the sources
        run: |
          npm run build
          # Also catches new files under dist/ that were never committed.
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --porcelain -- dist
            echo "dist is out of date: run npm run build and commit dist/"
            exit 1
          fi
