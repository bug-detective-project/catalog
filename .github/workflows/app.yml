name: app

# Reusable workflow for a project's main branch (the app with every bug fixed): lint, formatting
# and the tests, on every push and pull request. Each project calls it from its own
# .github/workflows/ci.yml on main (see the README); bd build keeps .github/ out of the ticket
# branches, so players never get workflows.
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: 26.12.1

jobs:
  app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
