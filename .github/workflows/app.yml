name: app

# Reusable workflow for a project's main branch (the app with every bug fixed): lint, formatting
# and the tests, on every push and pull request. Each project calls it from its own
# .github/workflows/ci.yml on main (see the README); bd build keeps .github/ out of the ticket
# branches, so players never get workflows.
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: 26.12.1
      # A project whose tests need its services (a database): the path, on main, of a JSON file
      # shaped like bugDetective.project.services of its qa branch. npm test then runs with those
      # services up and their variables set (bd with-services).
      services-file:
        type: string
        default: ''
      # Required with services-file: the commit of this repository the caller pins this workflow
      # to (the same hash as in its `uses:` line). bd runs from that commit.
      catalog-ref:
        type: string
        default: ''

jobs:
  app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - if: inputs.services-file == ''
        run: npm test
      - if: inputs.services-file != ''
        name: Check out bd (the catalog at the pinned commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bug-detective-project/catalog
          ref: ${{ inputs.catalog-ref }}
          path: .bd
          persist-credentials: false
      - if: inputs.services-file != ''
        name: npm test with the project's services
        env:
          SERVICES_FILE: ${{ inputs.services-file }}
        run: |
          # Out of the project's folder, so its test runner and linters never see it.
          mv .bd "$RUNNER_TEMP/bd"
          npm ci --omit=dev --ignore-scripts --prefix "$RUNNER_TEMP/bd"
          node "$RUNNER_TEMP/bd/dist/cli/main.js" with-services --file "$SERVICES_FILE" -- npm test
