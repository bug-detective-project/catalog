name: catalog

# Checks projects.json and every listed project as players download it: on every pull request
# into main, and once a day (GitHub disables this schedule after 60 days without activity in the
# repository; re-enable it in the Actions tab).
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: npm
      - run: npm ci
      - run: node dist/cli/main.js catalog-check
