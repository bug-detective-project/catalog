name: project

# Reusable workflow for a project's qa branch (see the README):
#   pull request into qa: bd validate and bd verify must pass before the merge;
#   push to qa (the merge): tags the publication as qa-v<version>.
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: 26.12.1

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The pull request's own code runs here (npm ci, the QA tool): never with a write token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fetch main, qa, the ticket branches and the tags
        run: git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*' --tags
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npx bd validate --base-ref "origin/${{ github.base_ref }}"
      - run: npx playwright install --with-deps chromium
      - run: npx bd verify

  tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch the ticket branches
        run: git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*' --tags
      - name: Tag the ticket commits and the publication
        # bd publish creates no tags: they are created here, on the merge, so nothing permanent
        # exists before it. Existing tags are never moved (the tag ruleset forbids it anyway).
        run: |
          version=$(node -p "require('./manifest.json').version")
          tags=()
          if git ls-remote --exit-code --tags origin "refs/tags/qa-v$version" >/dev/null; then
            echo "qa-v$version already exists"
          else
            git tag "qa-v$version"
            tags+=("qa-v$version")
          fi
          for pair in $(node -p "require('./manifest.json').entries.map((e) => e.tag + '=' + e.commit).join(' ')"); do
            tag=${pair%%=*}
            commit=${pair##*=}
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists"
            else
              git tag "$tag" "$commit"
              tags+=("$tag")
            fi
          done
          if [ ${#tags[@]} -gt 0 ]; then
            git push origin "${tags[@]}"
          fi
